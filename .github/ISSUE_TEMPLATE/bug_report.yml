name: Bug report
description: Report a gameplay, visual, save, or creator problem.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the screen, mission/world, expected result, and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and browser
      description: Include browser version, device/OS, orientation, and control style.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Optional screenshot or synthetic world. Do not post private saves or personal information.
