name: Tilewright CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['22', '24', '26']
        include:
          - os: windows-latest
            node: '24'
          - os: macos-latest
            node: '24'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install locked development tools
        run: npm ci --ignore-scripts
      - name: Check syntax, run tests, and build static package
        run: npm run verify
      - name: Check repository index and local references
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run check:repository
      - name: Verify public artifact and notices
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        run: npm run check:public
      - name: Upload tested website
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  browser:
    name: Built game / Chromium
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Fetch preserved migration baseline
        run: git fetch --no-tags origin a9a90e068940ac778cf02184860888d64f1a1ccd:refs/tags/legacy-mit-v0.30.1
      - name: Install locked browser tools
        run: npm ci --ignore-scripts
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps --only-shell chromium
      - name: Play and inspect the built game
        run: npm run test:browser:smoke
      - name: Check standalone paths, notices, and save continuity
        run: npm run test:browser:migration
      - name: Keep browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tilewright-browser-failure
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: Publish playable website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish tested game
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
